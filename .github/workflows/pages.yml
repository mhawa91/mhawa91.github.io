name: Deploy site (production + staging)

# Every push to main OR staging rebuilds and redeploys BOTH:
#   - main content    -> published at the site root      (mahmoudhawa.com/)
#   - staging content -> published under /staging/       (mahmoudhawa.com/staging/)
# so whichever branch triggered the run, the full combined site is redeployed
# consistently. Pushing to `main` never overwrites the staging preview, and
# pushing to `staging` never touches production.
#
# Security notes:
#   - Third-party actions are pinned to full commit SHAs (the tag is kept in a
#     trailing comment) so a moved/compromised tag cannot change what runs.
#   - Only the files the website actually needs are published (allow-list in
#     the "Assemble" step). Project notes, scripts, editor config and docs
#     stay in the repository and are NOT served from the website.
#   - Jobs get the minimum token permissions they need.

on:
  push:
    branches: [main, staging]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main (production root)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: src/main
          persist-credentials: false

      - name: Checkout staging (into /staging)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: staging
          path: src/staging
          persist-credentials: false
        continue-on-error: true

      - name: Prerender static HTML
        shell: bash
        run: |
          set -euo pipefail
          prerender_tree() {
            local src="$1"
            if [ -f "$src/scripts/prerender.mjs" ]; then
              node "$src/scripts/prerender.mjs" "$src"
            else
              echo "::notice::No prerender script in $src — publishing the shell as-is."
            fi
          }
          prerender_tree src/main
          if [ -f src/staging/index.html ]; then
            prerender_tree src/staging
          fi

      - name: Assemble published output (allow-list)
        shell: bash
        run: |
          set -euo pipefail

          # Copy only real website files from one checkout into a target dir.
          publish() {
            local src="$1" dest="$2"
            mkdir -p "$dest"
            for item in index.html content.md ar assets lib media services favicon.ico site.webmanifest .nojekyll; do
              if [ -e "$src/$item" ]; then
                cp -R "$src/$item" "$dest/"
              fi
            done
            # Developer notes that live next to the site code.
            find "$dest" -type f \( -name 'README.md' -o -name '*.ps1' \) -delete
          }

          publish src/main public
          if [ -f src/main/CNAME ]; then
            cp src/main/CNAME public/CNAME
          fi
          # Root-only files (served once, from the live site root):
          # crawler rules, the sitemap, llms.txt, and the RFC 9116 contact.
          # Prefer main. If main does not yet have robots.txt, copy it from
          # staging so /staging/ is disallowed immediately. Do not copy
          # sitemap.xml or llms.txt from staging — they list URLs that are
          # not on the live site until main is updated.
          if [ -f src/main/robots.txt ]; then
            cp src/main/robots.txt public/robots.txt
          elif [ -f src/staging/robots.txt ]; then
            cp src/staging/robots.txt public/robots.txt
          fi
          for item in sitemap.xml llms.txt; do
            if [ -f "src/main/$item" ]; then
              cp "src/main/$item" "public/$item"
            fi
          done
          if [ -f src/main/.well-known/security.txt ]; then
            mkdir -p public/.well-known
            cp src/main/.well-known/security.txt public/.well-known/security.txt
          elif [ -f src/staging/.well-known/security.txt ]; then
            mkdir -p public/.well-known
            cp src/staging/.well-known/security.txt public/.well-known/security.txt
          fi

          if [ -f src/staging/index.html ]; then
            publish src/staging public/staging
            # Keep every staging preview page out of search indexes, not only
            # the English homepage (Arabic and service pages included).
            while IFS= read -r -d '' file; do
              if ! grep -q 'name="robots" content="noindex, nofollow"' "$file"; then
                sed -i 's|<meta charset="UTF-8" />|&\n    <meta name="robots" content="noindex, nofollow" />|' "$file"
              fi
              grep -q 'name="robots" content="noindex, nofollow"' "$file"
            done < <(find public/staging -type f -name '*.html' -print0)
            printf '%s\n' 'User-agent: *' 'Disallow: /' > public/staging/robots.txt
          else
            echo "::notice::No staging branch content found - publishing production only."
          fi

          test -f public/index.html
          echo "Published files:"
          (cd public && find . -type f | sort)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
